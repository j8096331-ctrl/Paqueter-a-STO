function saveForm(next) {
  const d = draft;
  const errs = [];
  if (!String(d.folio).trim()) errs.push(['folio', 'Falta el número de nota']);
  else if (S.notas.some(n => fkey(n.folio) === fkey(d.folio) && n.id !== d.id)) errs.push(['folio', `Ya existe una nota con el N° ${d.folio}`]);
  if (!d.rem.nombre.trim()) errs.push(['rem.nombre', 'Falta el nombre de quien envía']);
  if (!d.dest.nombre.trim()) errs.push(['dest.nombre', 'Falta el nombre de quien recibe']);
  const items = d.items.filter(i => String(i.desc).trim());
  if (!items.length) errs.push(['items', 'Agrega al menos un artículo con descripción']);
  if (errs.length) { markErrors(errs); toast(errs[0][1], 'error'); return; }

  const now = Date.now();
  const folio = String(d.folio).trim();
  const rem = upsertPersona({ ...d.rem, id: d.rem.id });
  const dest = upsertPersona({ ...d.dest, id: d.dest.id });
  const prev = d.id ? IDX.nota.get(d.id) : null;
  const pagos = (prev?.pagos || []).filter(p => p.tipo !== 'anticipo');
  const ant = num(d.anticipo);
  if (ant > 0) {
    const old = prev?.pagos.find(p => p.tipo === 'anticipo');
    pagos.unshift({ id: old?.id || uid('pag'), tipo: 'anticipo', fecha: old?.fecha || now, monto: ant, moneda: d.moneda, metodo: d.metodo, lugar: DIRS[d.dir].from, por: d.recibio.trim() });
  }
  const n = {
    id: prev?.id || uid('not'), folio, fecha: d.fecha || todayISO(), dir: d.dir, viajeId: d.viajeId || '', recibio: d.recibio.trim(),
    remId: rem.id, destId: dest.id,
    rem: { nombre: d.rem.nombre.trim(), tel: d.rem.tel.trim(), lugar: d.rem.lugar.trim(), pais: d.rem.pais },
    dest: { nombre: d.dest.nombre.trim(), tel: d.dest.tel.trim(), lugar: d.dest.lugar.trim(), direccion: (d.dest.direccion || '').trim(), pais: d.dest.pais },
    items: items.map(i => ({ cant: num(i.cant) || 1, unidad: i.unidad || 'pz', desc: String(i.desc).trim(), empN: num(i.empN), empT: i.empT || 'B', pu: num(i.pu), importe: r2(num(i.importe)), ...(i.repo ? { repo: i.repo } : {}) })),
    moneda: d.moneda, tc: num(d.tc) || S.config.tc, cobroPeso: !!d.cobroPeso, peso: num(d.peso), pesoU: d.pesoU, tarifa: num(d.tarifa),
    extras: num(d.extras), descuento: num(d.descuento), valorDeclarado: num(d.valorDeclarado), bultosManual: num(d.bultosManual),
    pagos, estado: d.estado, obs: d.obs.trim(), fotos: d.fotos || [],
    historial: prev ? [...prev.historial] : [], entrega: prev?.entrega || null,
    creado: prev?.creado || now, act: now,
  };
  if (!prev || prev.estado !== n.estado) n.historial.push({ e: n.estado, t: now, por: n.recibio });
  if (n.estado === 'entregado' && !n.entrega) n.entrega = { nombre: n.dest.nombre, t: now };
  n.faltantes = prev?.faltantes || [];
  for (const it of n.items) {
    if (!it.repo) continue;
    const o = IDX.nota.get(it.repo.nid);
    const f = o?.faltantes.find(x => x.id === it.repo.fid);
    if (f && f.estado !== 'repuesto') { Object.assign(f, { estado: 'repuesto', repuestoEn: n.id, repuestoFolio: folio, repuestoT: now }); o.act = now; }
  }
  recalc(n);
  if (prev) S.notas[S.notas.indexOf(prev)] = n;
  else {
    S.notas.unshift(n);
    const pf = parseFolio(folio);
    const ser = pf && (Object.values(S.config.series).find(s => s.suf === pf.suf) || (!pf.suf && S.config.series[serieDe(n.dir)]));
    if (ser && pf.n >= ser.next) ser.next = pf.n + 1;
  }
  if (n.recibio) {
    S.config.ultimoEmpleado = n.recibio;
    if (!S.config.empleados.some(e => norm(e) === norm(n.recibio))) S.config.empleados.push(n.recibio);
  }
  S.config.ultimaDir = n.dir;
  commit();
  clearDraft();
  fillDatalists();
  if (prev) {
    draft = null;
    toast(`Nota N° ${folio} actualizada`);
    go('notas');
    setTimeout(() => openNota(n.id), 60);
    return;
  }
  draft = newDraft(n.dir, { viajeId: n.viajeId });
  renderForm();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast(`Nota N° ${folio} guardada · ${n.rem.nombre} → ${n.dest.nombre}`, 'ok', { action: { label: 'Ver nota', fn: () => openNota(n.id) } });
  if (next === 'print') openPrint(n.id, S.config.print.defFmt);
}

function hay(n) {
  return norm([n.folio, n.rem.nombre, n.dest.nombre, n.rem.lugar, n.dest.lugar, n.dest.direccion, n.obs, n.recibio, viajeNombre(n.viajeId), ...n.items.map(i => i.desc)].join(' '));

function matchQ(n, q) {
  if (!q) return true;
  const nq = norm(q), dq = digits(q);
  if (dq.length >= 3 && (digits(n.rem.tel).includes(dq) || digits(n.dest.tel).includes(dq))) return true;
  if (/^\d+\s*[a-z]{0,3}$/i.test(q.trim())) { const k = fkey(q), pf = parseFolio(n.folio); return fkey(n.folio).startsWith(k) || (pf && /^\d+$/.test(k) && pf.n === +k) || hay(n).includes(nq); }
  const h = hay(n);
  return nq.split(' ').every(w => h.includes(w));
}
function filtrarNotas(f) {
  const now = new Date();
  let desde = 0;
  if (f.rango === 'hoy') desde = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  else if (f.rango === '7') desde = Date.now() - 7 * DAY;
  else if (f.rango === '30') desde = Date.now() - 30 * DAY;
  else if (f.rango === 'mes') desde = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  return S.notas.filter(n =>
    (!f.dir || n.dir === f.dir) &&
    (!f.est || (f.est === 'activos' ? !['entregado', 'cancelado'].includes(n.estado) : n.estado === f.est)) &&
    (!f.pago || (f.pago === 'saldo' ? n.saldo > 0 && n.estado !== 'cancelado' : n.saldo <= 0)) &&
    (!f.viaje || (f.viaje === '__none' ? !n.viajeId : n.viajeId === f.viaje)) &&
    (!desde || Date.parse(n.fecha + 'T23:59') >= desde) &&
    matchQ(n, f.q)
  ).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || b.creado - a.creado);
}

function sigPad(canvas) {
  const ctx = canvas.getContext('2d');
  let drawing = false, empty = true, last = null;
  const size = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#14213d';
    empty = true;
  };
  const pos = e => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (canvas.width / r.width) / Math.min(2, window.devicePixelRatio || 1), y: (e.clientY - r.top) * (canvas.height / r.height) / Math.min(2, window.devicePixelRatio || 1) }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; empty = false; last = pos(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fill(); });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.quadraticCurveTo(last.x, last.y, (last.x + p.x) / 2, (last.y + p.y) / 2); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  ['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));
  setTimeout(size, 320);
  return { clear: size, isEmpty: () => empty, data: () => canvas.toDataURL('image/png') };
}

const H2I_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js';
let FONT_CSS = null;
async function fontCSS() {
  if (FONT_CSS !== null) return FONT_CSS;
  try {
    const href = document.querySelector('link[href*="fonts.googleapis"]')?.href;
    let css = await (await fetch(href)).text();
    css = css.split('@font-face').filter(b => /latin/.test(b) && !/vietnamese/.test(b)).map(b => '@font-face' + b).join('\n');
    for (const u of [...new Set((css.match(/url\((https:[^)]+)\)/g) || []).map(x => x.slice(4, -1)))]) {
      const bl = await (await fetch(u)).blob();
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(bl); });
      css = css.split(u).join(data);
    }
    FONT_CSS = css;
  } catch { FONT_CSS = ''; }
  return FONT_CSS;
}
async function notaPNG(n) {
  await Promise.all([loadQR(), loadScript(H2I_SRC)]);
  if (!window.htmlToImage) throw new Error('se necesita internet la primera vez');
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:-12000px;top:0;width:760px;background:#fff';
  box.innerHTML = htmlNota(n, { min: 8 });
  document.body.appendChild(box);
  try {
    await document.fonts?.ready;
    const fc = await fontCSS();
    const blob = await window.htmlToImage.toBlob(box.firstElementChild, { pixelRatio: 2, backgroundColor: '#ffffff', ...(fc ? { fontEmbedCSS: fc } : { skipFonts: true }) });
    if (!blob) throw new Error('imagen vacía');
    return blob;
  } finally { box.remove(); }
}
async function shareNotaImg(n, to, text) {
  const blob = await notaPNG(n);
  const file = new File([blob], `nota-${fkey(n.folio)}.png`, { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], text: text.replace(/\*/g, '') }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  download(file.name, blob);
  toast('Imagen de la nota descargada. En WhatsApp tócale al clip 📎 para adjuntarla.', 'info', { ms: 7000 });
  openWA(n[to].tel, n[to].pais, text);
}

ACT['viaje-mover'] = async b => {
  const v = IDX.viaje.get(b.dataset.id);

  const ns = S.notas.filter(n => n.viajeId === v.id && FLOW.indexOf(n.estado) > -1 && FLOW.indexOf(n.estado) < FLOW.indexOf(e));
  if (!ns.length) { toast('No hay notas por mover en este viaje', 'info'); return; }
  if (!(await confirmDlg('Mover viaje completo', `${plural(ns.length, 'nota')} pasarán a «${esc(e === 'transito' ? estLabel({ estado: e, dir: v.dir }) : EST[e].l)}».`, 'Mover'))) return;
  ns.forEach(n => setEstado(n, e, v.nombre));
  if (e === 'transito' && v.estado === 'abierto') v.estado = 'en ruta';
  commit(); refresh();
  toast(`${plural(ns.length, 'nota')} actualizadas`);
};

/* Respaldo / importación */
function exportBackup(share) {
  S.config.lastBackup = Date.now();
  const data = JSON.stringify({ app: 'paqueteria-sto-tomas', exportado: Date.now(), ...S });
  const name = `respaldo-sto-tomas-${todayISO()}.json`;
  commit();
  if (share && navigator.canShare) {
    const file = new File([data], name, { type: 'application/json' });
    if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Respaldo Paquetería' }).catch(() => {}); refresh(); return; }
  }
  download(name, data, 'application/json');
  toast('Respaldo descargado');
  refresh();
}
function mergeState(inc) {
  const r = { nuevas: 0, act: 0, per: 0 };
  const tomb = { ...S.borrados };
  for (const [k, v] of Object.entries(inc.borrados || {})) tomb[k] = Math.max(tomb[k] || 0, v);
  for (const key of ['personas', 'notas', 'viajes']) {
    const map = new Map(S[key].map(x => [x.id, x]));
    for (const it of inc[key]) {
      if (tomb[it.id]) continue;
      const ex = map.get(it.id);
      if (!ex) { map.set(it.id, it); if (key === 'notas') r.nuevas++; if (key === 'personas') r.per++; }
      else if ((it.act || 0) > (ex.act || 0)) { map.set(it.id, it); if (key === 'notas') r.act++; }
    }
    S[key] = [...map.values()].filter(x => !tomb[x.id]);
  }
  S.borrados = tomb;
  for (const k of ['MX', 'US']) S.config.series[k].next = Math.max(S.config.series[k].next, Math.floor(num(inc.config?.series?.[k]?.next)) || 1);
  for (const e of inc.config?.empleados || []) if (!S.config.empleados.some(x => norm(x) === norm(e))) S.config.empleados.push(e);
  const ids = new Set(S.config.catalogo.map(x => x.id));
  for (const x of inc.config?.catalogo || []) if (!ids.has(x.id) && !S.config.catalogo.some(y => norm(y.desc) === norm(x.desc) && y.dir === x.dir)) S.config.catalogo.push(x);
  S.notas.sort((a, b) => b.creado - a.creado);
  reindex();
  r.dup = autoDedupe();
  return r;
}
function autoDedupe() {
  let n = 0;
  const byKey = new Map();
  for (const p of [...S.personas].sort((a, b) => (a.creado || 0) - (b.creado || 0))) {
    const d = last10(p.tel);
    if (d.length < 10) continue;
    const k = d + '|' + norm(p.nombre).split(' ')[0];
    const keep = byKey.get(k);
    if (keep) { mergePersonas(keep, p); n++; } else byKey.set(k, p);
  }
  if (n) reindex();
  return n;
}
function importFile(mode) {
  const inp = $('#file-import');
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files?.[0];
    if (!f) return;
    try {
      const raw = JSON.parse(await f.text());
      if (!raw || (!Array.isArray(raw.notas) && !Array.isArray(raw.envios))) throw new Error('no es un respaldo de la paquetería');
      const inc = normalizeState(raw);
      inc.notas.forEach(n => recalc(normNota(n)));
      if (mode === 'replace') {
        if (!(await confirmDlg('Reemplazar todo', `Se borrará lo de este equipo y quedará el respaldo: <b>${plural(inc.notas.length, 'nota')}</b> y <b>${plural(inc.personas.length, 'persona')}</b>.`, 'Reemplazar', true))) return;
        S = inc;
        reindex();
        toast('Respaldo cargado');
      } else {
        const r = mergeState(inc);
        toast(`Combinado: ${plural(r.nuevas, 'nota nueva', 'notas nuevas')}, ${r.act} actualizadas, ${plural(r.per, 'persona nueva', 'personas nuevas')}${r.dup ? `, ${r.dup} duplicados unidos` : ''}`, 'ok', { ms: 6000 });
      }
      commit(); fillDatalists(); syncBrand(); route();
    } catch (e) { toast('Archivo no válido: ' + e.message, 'error'); }
  };
  inp.click();
}

function measureMM(html, widthMM) {
  const d = document.createElement('div');
  d.style.cssText = `position:absolute;left:-10000px;top:0;width:${widthMM}mm;visibility:hidden`;
  d.innerHTML = html;
  document.body.appendChild(d);
  const px = d.offsetHeight;
  d.remove();
  return px / (96 / 25.4);
}
function printJob(fmt, n) {

    if (P.ticketH === 'label') {

    }

    if (cands.length > 1) { q('#sc-msg').innerHTML = `Hay varias notas con ese número: ${cands.map(x => `<button class="btn sm" data-close data-act="nota" data-id="${x.id}">${esc(x.folio)} · ${esc(x.dest.nombre)}</button>`).join(' ')}`; return false; }
    const n = cands[0];
    if (!n) { q('#sc-msg').innerHTML = `<span class="t-red">No hay ninguna nota con el N° ${esc(folio)} en este equipo.</span>`; return false; }
    m.close();
    openNota(n.id);
    if (navigator.vibrate) navigator.vibrate(60);
    return true;
  };
  q('#sc-go').onclick = () => { const v = q('#sc-man').value.trim(); if (v) found(v); };
  q('#sc-man').addEventListener('keydown', e => { if (e.key === 'Enter') q('#sc-go').click(); });
  (async () => {
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Este navegador no permite usar la cámara aquí.');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      if (!alive) { stream.getTracks().forEach(t => t.stop()); return; }
      const video = q('video');
      video.srcObject = stream;
      await video.play();
      if ('BarcodeDetector' in window) { try { det = new window.BarcodeDetector({ formats: ['qr_code'] }); } catch { det = null; } }
      if (!det) await loadScript(JSQR_SRC);
      const cv = document.createElement('canvas');
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      const tick = async () => {
        if (!alive) return;
        let txt = null;
        try {
          if (det) { const r = await det.detect(video); txt = r[0]?.rawValue; }
          else if (window.jsQR && video.videoWidth) {
            cv.width = video.videoWidth; cv.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            txt = window.jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height)?.data;
          }
        } catch { /* cuadro sin código */ }
        const f = txt && parseQR(txt);
        if (f && found(f)) return;
        setTimeout(tick, 220);
      };
      tick();
    } catch (e) {
      q('.scan-v').classList.add('hide');
      q('#sc-msg').textContent = (e?.name === 'NotAllowedError' ? 'No se dio permiso para usar la cámara.' : e.message || 'No se pudo abrir la cámara.') + ' Escribe el número de nota.';
      q('#sc-man').focus();
    }
  })();
};

/* =====================================================================
   TEMA, INSTALACIÓN, MENÚ, ARRANQUE
   ===================================================================== */
function setTheme(t) {
  try { localStorage.setItem('paq-theme', t); } catch { /* */ }
  applyTheme();
}
function applyTheme() {
  let t = 'auto';
  try { t = localStorage.getItem('paq-theme') || 'auto'; } catch { /* */ }
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme-ic')?.querySelector('use')?.setAttribute('href', dark ? '#i-sun' : '#i-moon');
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0b111e' : '#1d5bbf';
}
ACT.theme = () => {
  const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  setTheme(dark ? 'light' : 'dark');
};
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('#btn-install').hidden = false; });
ACT.install = async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; $('#btn-install').hidden = true; };
ACT.menu = () => {
  const links = [['viajes', 'route', 'Viajes y manifiestos'], ['ajustes', 'sliders', 'Ajustes y respaldo'], ['personas', 'users', 'Personas'], ['entregas', 'truck', 'Entregas y cobros']];
  const m = modal({
    title: 'Más opciones', width: 420,
    body: `<div class="list card" style="box-shadow:none">${links.map(([h, ic, l]) => `<a class="li" href="#/${h}" data-close>${icon(ic)}<span class="t">${l}</span></a>`).join('')}
      <button class="li" style="border:0;width:100%;background:none;text-align:left" data-close data-act="scan">${icon('scan')}<span class="t">Escanear QR</span></button>
      <button class="li" style="border:0;width:100%;background:none;text-align:left" data-close data-act="theme">${icon('moon')}<span class="t">Cambiar tema</span></button>
      <div class="li" style="cursor:default"><span class="t">Dólar</span><input class="in" type="number" step="0.01" id="m-tc" value="${S.config.tc}" style="max-width:120px;margin-left:auto"></div></div>`,
  });
  m.el.querySelector('#m-tc').addEventListener('change', e => setTC(e.target.value));
};
function setTC(v) {
  const tc = num(v);
  if (tc <= 0) return;
  S.config.tc = tc;
  if (draft && !draft.id) { draft.tc = tc; }
  $('#tc-in').value = tc;
  commit();
  if (CUR.name === 'nueva') renderForm(); else refresh();
  toast(`Dólar a $${fNum(tc)} MXN`, 'ok', { ms: 1600 });
}
function syncBrand() {
  $('#brand-name').textContent = S.config.nombre.replace(/"/g, '');
  $('#brand-lema').textContent = S.config.lema;
}
function fillDatalists() {
  $('#dl-empleados').innerHTML = S.config.empleados.map(e => `<option value="${esc(e)}">`).join('');
  const lug = new Map();
  for (const p of S.personas) if (p.lugar) lug.set(norm(p.lugar), p.lugar);
  [S.config.origenMX, S.config.origenUS, 'Oregon', 'Los Ángeles, CA'].forEach(l => lug.set(norm(l), l));
  $('#dl-lugares').innerHTML = [...lug.values()].slice(0, 300).map(l => `<option value="${esc(l)}">`).join('');
}
function bindGlobal() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = ACT[b.dataset.act];
    if (!fn) return;
    if (b.tagName === 'A') e.preventDefault();
    fn(b, e);
  });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'Escape') { if (!AC.el.hidden) { AC.close(); return; } if (modalStack.length) { closeTop(); return; } }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); openPalette(); }
    else if (e.key.toLowerCase() === 'n' && !modalStack.length) { e.preventDefault(); go('nueva'); }
    else if (e.key === 'Enter' && e.target.matches?.('[role="button"][data-act]')) e.target.click();
  });
  $('#tc-in').addEventListener('change', e => setTC(e.target.value));
  const tb = $('#topbar');
  window.addEventListener('scroll', () => tb.classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  let wide = matchMedia('(min-width: 1381px)').matches;
  window.addEventListener('resize', debounce(() => {
    const w = matchMedia('(min-width: 1381px)').matches;
    if (w !== wide && CUR.name === 'nueva' && !$('#nf')?.contains(document.activeElement)) renderForm();
    wide = w;
    if (CUR.name === 'nueva') fitPaper($('#nf-prev-wrap'), $('#nf-prev'), 760);
  }, 200));
  const net = () => $('#net').classList.toggle('on', !navigator.onLine);
  window.addEventListener('online', net); window.addEventListener('offline', net); net();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  if (bc) bc.onmessage = async () => {
    try {
      const raw = await Store.get('state');
      if (!raw) return;
      S = normalizeState(raw);
      S.notas.forEach(n => recalc(normNota(n)));
      reindex();
      refreshDetail();
      refresh();
    } catch { /* */ }
  };
}
async function init() {
  applyTheme();
  await Store.init();
  let raw = null;
  try { raw = await Store.get('state'); } catch { raw = null; }
  let migrated = false;
  const olds = raw ? [] : oldData();
  if (olds.length) { raw = olds[0]; migrated = true; }
  S = normalizeState(raw);
  S.notas.forEach(n => recalc(normNota(n)));
  reindex();
  for (const o of olds.slice(1)) { try { const inc = normalizeState(o); inc.notas.forEach(n => recalc(normNota(n))); mergeState(inc); } catch { /* versión dañada */ } }
  draft = loadDraftLS();
  AC.init();
  bindGlobal();
  fillDatalists();
  syncBrand();
  $('#tc-in').value = S.config.tc;
  window.addEventListener('hashchange', route);
  route();
  updateDraftDot();
  if (migrated) { commit(); setTimeout(() => toast(`Se trajeron ${plural(S.notas.length, 'nota')} de la versión anterior del sistema`, 'info', { ms: 7000 }), 500); }
  else if (!raw) commit();
  navigator.storage?.persist?.().catch(() => {});
  if (/^https?:$/.test(location.protocol) && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  loadQR();
}
init();
})();
</script>
